<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dunia Dinosaurus</title>
<meta name="theme-color" content="#4CAF50">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Comic Sans MS','Segoe UI',sans-serif;background:linear-gradient(180deg,#a8e6cf 0%,#dcedc1 100%);min-height:100vh;color:#333;padding-bottom:80px}
header{background:linear-gradient(135deg,#4CAF50,#8BC34A);color:#fff;text-align:center;padding:18px 10px;border-radius:0 0 30px 30px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
header h1{font-size:1.7rem;margin-bottom:4px}
header p{font-size:.9rem;opacity:.95}
nav{display:flex;justify-content:center;gap:8px;padding:12px;flex-wrap:wrap}
nav button{background:#fff;border:3px solid #4CAF50;color:#4CAF50;padding:9px 16px;border-radius:25px;font-size:.95rem;font-weight:bold;cursor:pointer;transition:.2s}
nav button.active{background:#4CAF50;color:#fff}
main{max-width:900px;margin:0 auto;padding:12px}
.page{display:none}.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px}
.card{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.1);cursor:pointer;transition:transform .2s;border:2px solid #e0e0e0}
.card:active{transform:scale(.95);border-color:#4CAF50}
.card .emoji{font-size:2.8rem;display:block;margin-bottom:4px}
.card .name{font-weight:bold;font-size:1rem;color:#2E7D32}
.card .cat{font-size:.72rem;color:#777;margin-top:2px}
.filter{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.filter button{background:#e8f5e9;border:2px solid #a5d6a7;color:#2E7D32;padding:6px 13px;border-radius:20px;font-size:.82rem;cursor:pointer}
.filter button.active{background:#4CAF50;color:#fff;border-color:#4CAF50}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);justify-content:center;align-items:center;z-index:999;padding:15px}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:24px;padding:20px;max-width:440px;width:100%;text-align:center;position:relative;max-height:90vh;overflow-y:auto}
.modal-content .close{position:absolute;top:8px;right:14px;font-size:1.8rem;cursor:pointer;color:#999}
.modal-content .bigemoji{font-size:5rem;cursor:pointer}
.modal-content h2{color:#2E7D32;margin:8px 0}
.section{background:#f1f8e9;border-radius:12px;padding:10px 12px;margin:8px 0;text-align:left}
.section .title{font-weight:bold;color:#2E7D32;font-size:.9rem;margin-bottom:3px}
.section .val{font-size:.92rem;line-height:1.4}
.section.extinct{background:#ffebee}
.section.extinct .title{color:#c62828}
.btn-sound{background:#4CAF50;color:#fff;border:none;padding:11px 22px;border-radius:22px;font-size:.95rem;cursor:pointer;margin-top:10px;font-weight:bold}
.quiz{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 10px rgba(0,0,0,.1);text-align:center}
.quiz h2{color:#2E7D32;margin-bottom:12px}
.q-text{font-size:1.05rem;margin:12px 0;font-weight:bold}
.q-opts{display:grid;gap:8px;margin-top:12px}
.q-opts button{background:#e8f5e9;border:2px solid #a5d6a7;color:#2E7D32;padding:12px;border-radius:14px;font-size:.95rem;cursor:pointer;font-weight:bold}
.q-opts button:active{background:#c8e6c9}
.result{font-size:1.4rem;color:#4CAF50;font-weight:bold;margin:18px 0}
.btn-restart{background:#4CAF50;color:#fff;border:none;padding:11px 24px;border-radius:22px;font-size:.95rem;cursor:pointer;margin-top:12px;font-weight:bold}
footer{position:fixed;bottom:0;left:0;width:100%;background:#2E7D32;color:#fff;text-align:center;padding:9px;font-size:.78rem}
@media(max-width:500px){header h1{font-size:1.4rem}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
<h1>🦖 Dunia Dinosaurus</h1>
<p>Jelajahi dunia purba yang menakjubkan!</p>
</header>
<nav>
<button class="active" onclick="showPage('home',this)">🏠 Beranda</button>
<button onclick="showPage('learn',this)">📚 Belajar</button>
<button onclick="showPage('quiz',this)">🎮 Kuis</button>
</nav>
<main>
<section id="home" class="page active">
<div style="text-align:center;padding:18px">
<h2 style="color:#2E7D32">Selamat Datang! 🦕</h2>
<p style="margin:14px 0;font-size:1.05rem">Ayo kenali dinosaurus yang hidup jutaan tahun lalu. Tap gambar dinosaurus untuk melihat detailnya!</p>
<div style="font-size:3.5rem;margin:18px">🦖🦕🐊🦅🌋</div>
</div>
</section>
<section id="learn" class="page">
<h2 style="text-align:center;color:#2E7D32;margin-bottom:8px">📚 Belajar Dinosaurus</h2>
<div id="filter" class="filter"></div>
<div id="list" class="grid"></div>
</section>
<section id="quiz" class="page">
<h2 style="text-align:center;color:#2E7D32;margin-bottom:8px">🎮 Kuis Dinosaurus</h2>
<div id="quizBox" class="quiz"></div>
</section>
</main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<div id="modalBody"></div>
</div>
</div>
<footer>© 2026 Dunia Dinosaurus - Edukasi Anak</footer>
